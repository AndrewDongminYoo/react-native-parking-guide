ext.ParkingGuide = [
  minSdkVersion: 24,
  compileSdkVersion: 36
]

ext.getExtOrDefault = { prop ->
  if (rootProject.ext.has(prop)) {
    return rootProject.ext.get(prop)
  }

  return ParkingGuide[prop]
}


apply plugin: "com.android.library"

if (project.extensions.findByName("kotlin") == null) {
  apply plugin: "kotlin-android"
}


apply plugin: "com.facebook.react"

def camera = findProject(":react-native-vision-camera")
def frameProcessorsEnabled = camera != null &&
  findProject(":react-native-worklets-core") != null &&
  (rootProject.ext.has("VisionCamera_enableFrameProcessors") ?
    rootProject.ext.get("VisionCamera_enableFrameProcessors").toString() :
    project.findProperty("VisionCamera_enableFrameProcessors")?.toString()) != "false"
// Play Integrity is opt-in: the dependency and its source set are included only when the property is "true".
def attestationEnabled = (rootProject.ext.has("ParkingGuide_enableAttestation") ?
    rootProject.ext.get("ParkingGuide_enableAttestation").toString() :
    project.findProperty("ParkingGuide_enableAttestation")?.toString()) == "true"

android {
  namespace "com.parkingguide"

  compileSdkVersion getExtOrDefault("compileSdkVersion")

  defaultConfig {
    minSdkVersion getExtOrDefault("minSdkVersion")
    testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
  }

  sourceSets.main.java.srcDir(frameProcessorsEnabled ? "src/visionCamera/java" : "src/noCamera/java")
  sourceSets.main.java.srcDir(attestationEnabled ? "src/attestation/java" : "src/noAttestation/java")
  // Synthetic detector fixtures from scripts/make-fixture-models.py; outside the published package files.
  sourceSets.androidTest.assets.srcDir("../fixtures/detector")

  packaging {
    jniLibs {
      // Only the androidTest APK merges both the Hermes/React Native libraries and react-native-worklets-core, which
      // ships its own copies of these files.
      pickFirsts += ["**/libhermestooling.so", "**/libhermesvm.so"]
    }
  }
}

dependencies {
  implementation "com.facebook.react:react-android"
  implementation "com.google.ai.edge.litert:litert:1.4.2"
  if (frameProcessorsEnabled) {
    implementation project(":react-native-vision-camera")
  }
  if (attestationEnabled) {
    implementation "com.google.android.play:integrity:1.6.0"
  }
  testImplementation "junit:junit:4.13.2"
  androidTestImplementation "androidx.test:runner:1.7.0"
  androidTestImplementation "androidx.test.ext:junit:1.3.0"
}
