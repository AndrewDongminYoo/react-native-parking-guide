# This file controls the behavior of Trunk: https://docs.trunk.io/cli
# To learn more about the format of this file, see https://docs.trunk.io/reference/trunk-yaml
version: 0.1
cli:
  version: 1.25.0
plugins:
  sources:
    - id: trunk
      ref: v1.11.0
      uri: https://github.com/trunk-io/plugins
# Many linters and tools depend on runtimes - configure them here. (https://docs.trunk.io/runtimes)
runtimes:
  enabled:
    - go@1.21.0
    - java@13.0.11
    - node@22.16.0
    - python@3.14.4
# This is the section where you manage your linters. (https://docs.trunk.io/check/configuration)
# cspell:words dotenv, taplo
lint:
  disabled:
    - bandit
    - dotenv-linter
    - grype
    - taplo
  enabled:
    - actionlint@1.7.8
    - black@26.10.1
    - checkov@3.4.0
    - eslint@9.39.5
    - git-diff-check
    - isort@9.0.2
    - ktlint@1.7.1
    - markdownlint@0.50.0
    - osv-scanner@2.2.4
    - oxipng@9.1.5
    - pinact@4.1.1!:
        commands: [lint, upgrade]
    - prettier@3.9.10
    - ruff@0.17.3
    - shfmt@3.13.1
    - trivy@0.70.0
    - trufflehog@3.90.13
    - yamllint@1.38.0
  ignore:
    # Preserve skill files from the upstream commit recorded in .github/skills/README.md.
    - linters:
        - prettier
      paths:
        - .github/skills/**
        - '!.github/skills/README.md'
    - linters:
        - eslint
      paths:
        - .yarn/releases/yarn-*.cjs
        - eslint.config.mjs
    - linters:
        - osv-scanner
      paths:
        - example/ios/Podfile.lock
actions:
  enabled:
    - trunk-announce
    - trunk-check-pre-push
    - trunk-fmt-pre-commit
    - trunk-upgrade-available
